; Alternativa ao Arduino IDE (VS Code + PlatformIO). Core Arduino-ESP32 3.x via pioarduino.
[platformio]
src_dir = hoodi_pet
default_envs = pet

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.12.1

; Placa fisica: SuperMini com Serial pela USB nativa.
[env:pet]
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  ${env.lib_deps}
  h2zero/NimBLE-Arduino@^2.5.2

; Wokwi no VS Code: sem Bluetooth, Serial pela UART (wokwi.toml aponta para este build).
[env:wokwi]
build_flags =
  -DHOODI_SEM_BLE=1
