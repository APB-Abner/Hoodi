openapi: 3.1.0
info:
  title: hoodi API
  version: 0.6.0-draft
  description: 'Consolidated draft design contract: preserved v0.5.3 operations plus
    the v0.6 logout, account/panic, H3 and route increments. Includes planned operations;
    /openapi/v1.json lists the operations implemented by the API. Version comes from
    Hoodi.Api/Hoodi.Api.csproj. Regenerate with python scripts/build_api_contract.py.'
servers:
- url: http://localhost:5000
  description: Desenvolvimento local (não transmitir dados reais)
- url: https://api.exemplo.invalid
  description: Placeholder; substituir por HTTPS real na VM
tags:
- name: Autenticacao
- name: Contatos
- name: Push
- name: Risco
- name: Panico
- name: Trajetos
- name: Dispositivos
- name: Administracao
- name: Saude
- name: Rotas
security:
- bearerAuth: []
