  /v1/rotas/avaliar:
    post:
      tags:
      - Rotas
      operationId: post_v1_rotas_avaliar
      summary: Comparar exposicao relativa de rotas a pe sem persistir percurso
      description: 'API consulta provedor externo de rotas a pé sem gravar geometria, origem ou destino. Para
        cada trecho conhecido, K = soma(metros_do_trecho × riscoRelativo). Lknown = soma metros com estimativa;
        Ltotal = distância total. ExposicaoRelativa = (K/Lknown) × Ltotal (unidade: metro ponderado pelo risco
        relativo), apenas quando Lknown>0 e cobertura = 100×Lknown/Ltotal >=70%. Os trechos desconhecidos NÃO
        são tratados como risco zero; a estimativa extrapola média observada ao trecho não observado e divulga
        percentualSemEstimativa = 100 - cobertura. Não representa probabilidade individual. Se qualquer rota
        tiver cobertura<70% → inconclusiva, todas posicao=null, mas preservar exposição individual nas rotas
        com cobertura suficiente; se nenhuma alternativa ou provedor/grade indisponível → indisponivel com
        rotas=[]. Ranking concluído: menor exposição estimada primeiro; diferença relativa menor que 5% do
        MENOR valor → empate técnico e mesma posicao (não ranquear diferenças espúrias). Se só uma rota válida,
        inconclusiva, motivo=apenas_uma_rota, posicao=null. Tempo da passagem no trecho: saidaEm + (distância
        acumulada até início do trecho / distância total) × duracaoSegundos, com velocidade média uniforme
        assumida; fatiar trechos que cruzem hora civil/meia-noite e usar faixa e tipoDia em America/Sao_Paulo
        para cada fatia; sábado/domingo=fim_semana, feriados conforme calendário de produção homologado (pendente);
        v0.5 usa sábado/domingo como fim_semana. saidaEm deve ser ISO datetime com offset e respeitar a janela
        relativa ao relógio UTC do servidor; fora dela retorna 422 SAIDA_FORA_JANELA, não classifica como risco
        zero. Se versaoGrade da comparação divergir da grade em cache, app obtém snapshot da mesma versão antes
        de sobrepor cores/ranking; se não conseguir, não exibe comparação como sincronizada. Privacidade: nenhum
        destino/geometria no banco ou logs, e nenhum dado fora da requisição ou resposta efêmera. Cobertura
        de 70% e empate de 5% são PARAMETROS PROPOSTOS para validação da equipe.  Janela obrigatória avaliada
        no instante da requisição pelo relógio do servidor: agoraUTC - 5min <= saidaEm <= agoraUTC + 48h; depois
        de receber as alternativas, saidaEm + MAIOR duracaoSegundos <= agoraUTC + 48h. Instantes comparados
        em UTC; classificação de tipoDia/faixa em America/Sao_Paulo. Fora da janela: 422 SAIDA_FORA_JANELA;
        NÃO depende de periodoDados ou validade da versão de grade. Chamada em outra data pode ter resultado
        distinto. Precedência de resultados: falha do provedor, ausência de alternativa, grade indisponível
        ou fora do território -> indisponivel; existindo rotas, qualquer cobertura <70% -> inconclusiva/cobertura_insuficiente
        (inclusive rota única); caso uma rota >=70% -> inconclusiva/apenas_uma_rota, EXIBE nota sem ranking
        com texto "Rota avaliada; sem alternativas para comparar"; 2-3 rotas todas >=70% -> concluida. Toda
        rota listada traz geometria não vazia; não usar mapa cache de outra versão. Empate com 2-3 rotas: ordenar
        por exposição crescente, agrupar a partir da menor estimativa restante usando diferença E/Emenor <5%,
        atribuir a mesma posição densa ao grupo e repetir; exemplo 1000/1040/1080 -> 1,1,2. Exatamente 5% já
        não empata. Retornar rotas ordenadas por posicao/nota/rotaId. Para grade com cobertura parcial não
        representar desconhecido como risco 0.

        Regra v0.5: território fora da cobertura retorna 200 situacao=indisponivel/motivo=fora_territorio,
        NUNCA 422. Em inconclusiva/cobertura_insuficiente, cada rota com cobertura >=70% mantém sua exposição
        relativa com duas casas decimais e posicao=null; rota abaixo de 70% fica com exposicaoRelativa=null
        e posicao=null. Não apresentar ranking parcial. A API usa decimal e arredonda exposição para 2 casas
        (arredondamento de meio afastado de zero) ANTES de ranquear e empatar; posição densa é calculada somente
        a partir dos valores retornados. Nenhuma posição usa valor oculto mais preciso. Empate ocorre com diferença
        estritamente <5% em relação à âncora do grupo. Em rota única com >=70%, motivo=apenas_uma_rota e nota
        exibida sem ranking. A janela UTC da partida/chegada é independente do período histórico da grade.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvaliacaoRotasEntrada'
            example:
              origem:
                latitude: -23.551
                longitude: -46.637
              destino:
                latitude: -23.557
                longitude: -46.643
              saidaEm: '2026-11-08T21:50:00-03:00'
      responses:
        '200':
          description: Comparacao concluida, inconclusiva ou indisponivel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvaliacaoRotasResultado'
              examples:
                concluida:
                  summary: Comparação de duas rotas
                  value:
                    situacao: concluida
                    motivo: null
                    versaoGrade: mock-2026-11-08-v1
                    coberturaMinimaPercentual: 70
                    rotas:
                    - rotaId: r1
                      distanciaMetros: 900
                      duracaoSegundos: 720
                      exposicaoRelativa: 1020
                      percentualSemEstimativa: 0
                      geometriaCodificada: vxvnCfxs{GnKnK~W~W
                      posicao: 1
                    - rotaId: r2
                      distanciaMetros: 1100
                      duracaoSegundos: 880
                      exposicaoRelativa: 1300
                      percentualSemEstimativa: 10
                      geometriaCodificada: vxvnCfxs{GbBf^zT~WnKwQ
                      posicao: 2
                    unidadeExposicao: metro_risco_relativo
                    metodoTrechoDesconhecido: extrapolacao_media_trechos_conhecidos
                    empateTecnicoPercentual: 5
                coberturaMista:
                  summary: Uma rota suficiente + outra insuficiente
                  value:
                    unidadeExposicao: metro_risco_relativo
                    metodoTrechoDesconhecido: extrapolacao_media_trechos_conhecidos
                    empateTecnicoPercentual: 5
                    situacao: inconclusiva
                    motivo: cobertura_insuficiente
                    versaoGrade: mock-2026-11-08-v1
                    coberturaMinimaPercentual: 70
                    rotas:
                    - rotaId: boa
                      distanciaMetros: 1000
                      duracaoSegundos: 840
                      exposicaoRelativa: 1100.25
                      percentualSemEstimativa: 5
                      geometriaCodificada: vxvnCfxs{GnKnK~W~W
                      posicao: null
                    - rotaId: incompleta
                      distanciaMetros: 800
                      duracaoSegundos: 720
                      exposicaoRelativa: null
                      percentualSemEstimativa: 40
                      geometriaCodificada: vxvnCfxs{GbBf^zT~WnKwQ
                      posicao: null
                foraTerritorio:
                  summary: 'Destino fora da área coberta: 200 indisponível'
                  value:
                    unidadeExposicao: metro_risco_relativo
                    metodoTrechoDesconhecido: extrapolacao_media_trechos_conhecidos
                    empateTecnicoPercentual: 5
                    situacao: indisponivel
                    motivo: fora_territorio
                    versaoGrade: null
                    coberturaMinimaPercentual: 70
                    rotas: []
        '400':
          description: Parametro invalido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Nao autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
        '429':
          description: Limite de requisicoes
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
        '422':
          description: Saída anterior a agora−5min ou chegada posterior a agora+48h, calculadas pelo relógio
            UTC do servidor; nunca representa fora do território.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErroSaidaRota'
              example:
                title: Saída fora da janela de consulta
                status: 422
                code: SAIDA_FORA_JANELA
                traceId: trace-sintetico-422
  /v1/auth/confirmar-email:
    post:
      tags:
      - Autenticacao
      operationId: post_v1_auth_confirmar_email
      summary: Confirmar posse do e-mail com token de uso único
      description: Consome token secreto de 30 min, uso único, recebido por e-mail. A pessoa com posse do token
        define nome e senha nesta chamada; só então cria/ativa a conta. Conta já existente não tem senha alterada
        por esse token; código não aparece em query string nem logs. Em dev Mailpit. JWT não exigido. Nunca
        usar senha fornecida por terceiro no passo registrar.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmarEmailEntrada'
            example:
              token: TOKEN_SINTETICO_NAO_VALIDO_0123456789abcdef
              nome: Pessoa Exemplo
              senha: SENHA_FICTICIA_NAO_USAR_123!
      responses:
        '200':
          description: Confirmação realizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmarEmailResultado'
              example:
                mensagem: E-mail confirmado. Faça login.
        '400':
          description: Token malformado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token inválido, expirado ou consumido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
        '429':
          description: Limite de tentativas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
  /v1/auth/solicitar-redefinicao:
    post:
      tags:
      - Autenticacao
      operationId: post_v1_auth_solicitar_redefinicao
      summary: Solicitar recuperação da senha (sem enumeração)
      security: []
      description: Sempre 202 genérico para conta existente/inexistente, sem evidência temporal de existência.
        Somente conta verificada recebe por e-mail token de reset_senha, nunca enviar na resposta, logs ou
        query string. Token aleatório com hash no banco, validade 30 min e uso único. SMTP dev via Mailpit
        restrito; rate-limit por IP e e-mail. Solicitar redefinição não modifica senha, não altera cadastro
        e não revoga sessões. Não reutilizar token confirmar_email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarRedefinicaoEntrada'
            example:
              email: titular.exemplo@example.invalid
      responses:
        '202':
          description: Aceite genérico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitarRedefinicaoAceito'
              example:
                mensagem: Se os dados forem elegiveis, as instrucoes serao enviadas.
        '400':
          description: E-mail malformado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
        '429':
          description: Limite de tentativas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
  /v1/auth/redefinir-senha:
    post:
      tags:
      - Autenticacao
      operationId: post_v1_auth_redefinir_senha
      summary: Trocar senha por token de recuperação
      security: []
      description: Consumir token de propósito reset_senha, uso único, válido por 30min, com verificação atômica.
        Só titular que comprova posse do e-mail pelo token escolhe a nova senha. Token de cadastro não pode
        redefinir senha. Não mudar senha em registrar. Após sucesso, invalidar todas as famílias de refresh
        do usuário; para acessos JWT ainda válidos exigir validação de versaoSessao/securityStamp no servidor;
        chaves vinculadas do ESP32 não são automaticamente revogadas. Erros genéricos sem revelar e-mail. Após
        redefinir e autenticar-se novamente, titular deve consultar GET /v1/dispositivos e pode revogar dispositivos
        ativos individualmente; reset de senha NÃO substitui auditoria de dispositivos nem revoga as chaves
        automaticamente (decisão explícita v0.5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedefinirSenhaEntrada'
            example:
              token: RESET_SINTETICO_NAO_VALIDO_0123456789abcdef
              novaSenha: SENHA_FICTICIA_NOVA_123!
      responses:
        '200':
          description: Senha atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedefinirSenhaResultado'
              example:
                mensagem: Senha redefinida. Faça login novamente.
        '400':
          description: Dados malformados
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Token inválido, expirado ou consumido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
        '429':
          description: Limite de tentativas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
  /v1/dispositivos:
    get:
      tags:
      - Dispositivos
      summary: Listar dispositivos vinculados à conta do titular
      operationId: listarDispositivos
      description: 'Somente JWT do titular; lista dispositivos ativos e revogados com dispositivoId, estado
        e metadados não sensíveis, nunca X-Device-Key. Permite localizar e revogar dispositivos depois de redefinir
        senha. A redefinição revoga refresh/JWT anteriores, mas não revoga automaticamente credenciais do ESP32;
        após novo login, usar esta listagem e DELETE /v1/dispositivos/{dispositivoId}. Não permitir consultar
        dispositivos de outro usuário. O limite de 100 é APENAS de dispositivos ATIVOS, revogados não contam.
        Histórico revogado é paginado (páginas até 100 registros). Ordenação estável por vinculadoEm desc e
        dispositivoId. O cursor opaco é vinculado ao titular autenticado e à posição de paginação (keyset),
        com validade de 30 min; não permite consultar páginas de outra conta. A página final omite
        X-Proximo-Cursor. Novos registros após início de uma listagem aparecem ao reiniciar a consulta.'
      security:
      - bearerAuth: []
      parameters:
      - name: limite
        in: query
        required: false
        description: Quantidade por página, padrão 100, máximo 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: cursor
        in: query
        required: false
        description: Cursor opaco de paginação (30 min), associado ao JWT do titular; omitir na primeira página.
        schema:
          type: string
          minLength: 1
          maxLength: 2048
      responses:
        '200':
          description: Dispositivos do titular (inclusive revogados), página até 100 itens
          headers:
            X-Proximo-Cursor:
              description: Cursor para próxima página; ausente quando não há mais itens. Nunca contém segredos.
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispositivosLista'
              example:
              - dispositivoId: aa111111-2222-4333-8444-555555555555
                tipo: esp32
                apelido: Botão da mochila
                estado: ativo
                vinculadoEm: '2026-11-08T12:00:00-03:00'
                ultimoUsoEm: '2026-11-08T14:30:00-03:00'
                revogadoEm: null
              - dispositivoId: bb111111-2222-4333-8444-555555555555
                tipo: wokwi
                apelido: Simulador antigo
                estado: revogado
                vinculadoEm: '2026-11-07T12:00:00-03:00'
                ultimoUsoEm: null
                revogadoEm: '2026-11-08T13:00:00-03:00'
        '401':
          description: JWT ausente ou inválido
        '400':
          description: Cursor inválido/expirado ou limite de página inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
        '429':
          description: Excesso de consultas
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
      description: Credencial separada e revogável vinculada ao ESP32/Wokwi
  schemas:
    Erro:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
        traceId:
          type: string
      additionalProperties: false
      required:
      - title
      - status
      - code
      - traceId
      description: Erro no formato Problem Details; não expõe PII.
    Usuario:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        email:
          type: string
          format: email
      additionalProperties: false
      required:
      - id
      - nome
      - email
    CadastroEntrada:
      type: object
      properties:
        email:
          type: string
          format: email
      additionalProperties: false
      required:
      - email
      description: Solicita token de confirmação por e-mail. NÃO recebe nome nem senha antes da prova de posse.
        Se e-mail existente, a resposta é idêntica e credenciais ficam inalteradas.
    LoginEntrada:
      type: object
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
      additionalProperties: false
      required:
      - email
      - senha
    TokensAuth:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiraEm:
          type: string
          format: date-time
        usuario:
          $ref: '#/components/schemas/Usuario'
        refreshToken:
          type: string
          minLength: 16
          description: Novo refresh token opaco; durante 45s o anterior pode receber exatamente a mesma resposta
            cifrada armazenada temporariamente.
        expiraRefreshEm:
          type: string
          format: date-time
          description: Prazo deslizante (7 dias sem uso), máximo absoluto (30 dias após login); parâmetros
            v0.5 a confirmar pela equipe.
      additionalProperties: false
      required:
      - accessToken
      - tokenType
      - expiraEm
      - usuario
      - refreshToken
      - expiraRefreshEm
    NovoConvite:
      type: object
      properties:
        codigo:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[0-9A-F]{64}$'
          description: >-
            Codigo canonico de 64 caracteres hexadecimais maiusculos. O servidor aplica
            Trim().ToUpperInvariant() antes da validacao e do hash; as restricoes descrevem
            o valor normalizado. Compartilhar por hoodi://convite#codigo=CODIGO, que pode
            ser transportado por link ou codificado em QR pelo app. Nao digitar manualmente,
            nao colocar o codigo em query string e nao registrar em logs.
        expiraEm:
          type: string
          format: date-time
        direcao:
          type: string
          enum:
          - titular_para_contato
        conviteId:
          type: string
          format: uuid
      additionalProperties: false
      required:
      - conviteId
      - codigo
      - expiraEm
      - direcao
    ResgateConviteEntrada:
      type: object
      properties:
        codigo:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[0-9A-F]{64}$'
          description: >-
            Codigo canonico de 64 caracteres hexadecimais maiusculos. O servidor aplica
            Trim().ToUpperInvariant() antes da validacao e do hash; as restricoes descrevem
            o valor normalizado. Compartilhar por hoodi://convite#codigo=CODIGO, que pode
            ser transportado por link ou codificado em QR pelo app. Nao digitar manualmente,
            nao colocar o codigo em query string e nao registrar em logs.
        decisao:
          type: string
          enum:
          - aceitar
          - rejeitar
      additionalProperties: false
      required:
      - codigo
      - decisao
    Vinculo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        titularId:
          type: string
          format: uuid
        contatoId:
          type: string
          format: uuid
        estado:
          type: string
          enum:
          - aceito
          - revogado
        direcao:
          type: string
          enum:
          - titular_para_contato
        nomeExibicao:
          type: string
          minLength: 1
          description: Nome atual do outro participante na perspectiva de quem consulta, sem e-mail.
        papelDoSolicitante:
          type: string
          enum:
          - titular
          - contato
      additionalProperties: false
      required:
      - id
      - titularId
      - contatoId
      - estado
      - direcao
      - nomeExibicao
      - papelDoSolicitante
      description: Convite pendente/rejeitado/expirado e estado do convite, nao do vinculo; vinculo so existe
        com aceite.
    TokenPushEntrada:
      type: object
      properties:
        expoPushToken:
          type: string
          pattern: ^ExponentPushToken\[.+\]$|^ExpoPushToken\[.+\]$
        plataforma:
          type: string
          enum:
          - ios
          - android
        instalacaoId:
          type: string
          minLength: 1
          maxLength: 100
      additionalProperties: false
      required:
      - expoPushToken
      - plataforma
      - instalacaoId
    TokenPushResumo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ativo:
          type: boolean
      additionalProperties: false
      required:
      - id
      - ativo
    CelulaRisco:
      type: object
      properties:
        geohash:
          type: string
          description: Geohash base32 (sem a, i, l, o)
          minLength: 6
          maxLength: 7
          pattern: ^[0123456789bcdefghjkmnpqrstuvwxyz]{6,7}$
        faixaHoraria:
          type: integer
          minimum: 0
          maximum: 23
        tipoDia:
          type: string
          enum:
          - util
          - fim_semana
        nivel:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 3
        riscoRelativo:
          type:
          - number
          - 'null'
          minimum: 0
        nOcorrencias:
          type: integer
          minimum: 0
        suficiente:
          type: boolean
        motivoDesconhecido:
          type:
          - string
          - 'null'
          enum:
          - amostra_insuficiente
          - sem_referencia
          - dado_desatualizado
          - null
      additionalProperties: false
      required:
      - geohash
      - faixaHoraria
      - tipoDia
      - nivel
      - riscoRelativo
      - nOcorrencias
      - suficiente
      - motivoDesconhecido
      allOf:
      - if:
          properties:
            suficiente:
              const: true
          required:
          - suficiente
        then:
          properties:
            nivel:
              type: integer
              minimum: 0
              maximum: 3
            riscoRelativo:
              type: number
              minimum: 0
            motivoDesconhecido:
              type: 'null'
          required:
          - nivel
          - riscoRelativo
          - motivoDesconhecido
        else:
          properties:
            nivel:
              type: 'null'
            riscoRelativo:
              type: 'null'
            motivoDesconhecido:
              type: string
              enum:
              - amostra_insuficiente
              - sem_referencia
              - dado_desatualizado
          required:
          - nivel
          - riscoRelativo
          - motivoDesconhecido
      description: 'Se suficiente=true: nivel e riscoRelativo presentes e motivoDesconhecido=null. Se false:
        ambos null e motivo obrigatorio. Limiar e precisao conforme a referencia da grade.'
    ReferenciaRisco:
      type: object
      properties:
        area:
          type: string
        tipo:
          type: string
          enum:
          - frequencia_relativa_ocorrencias
        denominador:
          type: string
        metodo:
          type: string
        naoEhProbabilidadeIndividual:
          type: boolean
        limiaresNivel:
          $ref: '#/components/schemas/LimiaresNivel'
      additionalProperties: false
      required:
      - area
      - tipo
      - denominador
      - metodo
      - naoEhProbabilidadeIndividual
      - limiaresNivel
    Grade:
      type: object
      properties:
        versao:
          type: string
        fuso:
          type: string
          enum:
          - America/Sao_Paulo
        dataInicio:
          type: string
          format: date
        dataFim:
          type: string
          format: date
        geradaEm:
          type: string
          format: date-time
        periodoDados:
          type: string
        referencia:
          $ref: '#/components/schemas/ReferenciaRisco'
        celulas:
          type: array
          items:
            $ref: '#/components/schemas/CelulaRisco'
          maxItems: 1000
        precisaoGeohash:
          type: integer
          minimum: 6
          maximum: 7
        proximoCursor:
          type:
          - string
          - 'null'
          minLength: 1
          description: Cursor opaco para página seguinte; null na última página. Não é localização do usuário.
        limitePagina:
          type: integer
          minimum: 1
          maximum: 1000
          description: Quantidade máxima de células desta página.
      additionalProperties: false
      required:
      - versao
      - fuso
      - dataInicio
      - dataFim
      - geradaEm
      - periodoDados
      - referencia
      - celulas
      - precisaoGeohash
      - proximoCursor
      - limitePagina
    VersaoGrade:
      type: object
      properties:
        versao:
          type: string
        publicadaEm:
          type: string
          format: date-time
        periodoDados:
          type: string
        fuso:
          type: string
        precisaoGeohash:
          type: integer
          minimum: 6
          maximum: 7
        limiaresNivel:
          $ref: '#/components/schemas/LimiaresNivel'
      additionalProperties: false
      required:
      - versao
      - publicadaEm
      - periodoDados
      - fuso
      - precisaoGeohash
      - limiaresNivel
    ResultadoImportacao:
      type: object
      properties:
        versao:
          type: string
        linhasImportadas:
          type: integer
          minimum: 1
        publicadaEm:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - versao
      - linhasImportadas
      - publicadaEm
    PanicoEntrada:
      type: object
      properties:
        idempotencyKey:
          type: string
          format: uuid
        origem:
          type: string
          enum:
          - app
          - watch
          - esp32
          description: Origem informativa (app/watch/esp32). Origem nao e prova do relogio e nao entra na comparacao
            idempotente.
        latitude:
          type:
          - number
          - 'null'
          minimum: -90
          maximum: 90
        longitude:
          type:
          - number
          - 'null'
          minimum: -180
          maximum: 180
        observacao:
          type:
          - string
          - 'null'
          maxLength: 300
      additionalProperties: false
      required:
      - idempotencyKey
      - origem
      description: As coordenadas devem ser ambas numéricas, ambas null, ou ambas omitidas. Nunca uma preenchida
        e a outra ausente/null. Origem é informativa, mas é validada por classe de credencial.
      allOf:
      - oneOf:
        - properties:
            latitude:
              type: number
              minimum: -90
              maximum: 90
            longitude:
              type: number
              minimum: -180
              maximum: 180
          required:
          - latitude
          - longitude
        - properties:
            latitude:
              type: 'null'
            longitude:
              type: 'null'
          required:
          - latitude
          - longitude
        - not:
            anyOf:
            - required:
              - latitude
            - required:
              - longitude
    ResumoDespachos:
      type: object
      properties:
        estado:
          type: string
          enum:
          - sem_destinatarios
          - em_processamento
          - aceito_expo
          - aceito_provedor_push
          - aberto_no_app
          - nenhum_envio_confirmado
        total:
          type: integer
          minimum: 0
        pendentes:
          type: integer
          minimum: 0
        aceitosExpo:
          type: integer
          minimum: 0
        aceitosProvedor:
          type: integer
          minimum: 0
        abertosNoApp:
          type: integer
          minimum: 0
        falhosOuCancelados:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
      - estado
      - total
      - pendentes
      - aceitosExpo
      - aceitosProvedor
      - abertosNoApp
      - falhosOuCancelados
    PanicoRegistrado:
      type: object
      properties:
        pedidoId:
          type: string
          format: uuid
        registradoEm:
          type: string
          format: date-time
        origem:
          type: string
          enum:
          - app
          - watch
          - esp32
        resumo:
          $ref: '#/components/schemas/ResumoDespachos'
        reutilizado:
          type: boolean
          description: False se primeiro 202; true se replay 200 da mesma intenção. Mostra pedido anterior
            ao cliente, não confirma entrega do aviso.
      additionalProperties: false
      required:
      - pedidoId
      - registradoEm
      - origem
      - resumo
      - reutilizado
    PanicoStatus:
      type: object
      properties:
        pedidoId:
          type: string
          format: uuid
        registradoEm:
          type: string
          format: date-time
        resumo:
          $ref: '#/components/schemas/ResumoDespachos'
      additionalProperties: false
      required:
      - pedidoId
      - registradoEm
      - resumo
    PanicoRecebidoResumo:
      type: object
      properties:
        pedidoId:
          type: string
          format: uuid
        titularNome:
          type: string
        registradoEm:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - pedidoId
      - titularNome
      - registradoEm
    PanicoDetalhe:
      type: object
      properties:
        pedidoId:
          type: string
          format: uuid
        titularNome:
          type: string
        registradoEm:
          type: string
          format: date-time
        origem:
          type: string
          enum:
          - app
          - watch
          - esp32
        latitude:
          type:
          - number
          - 'null'
        longitude:
          type:
          - number
          - 'null'
        observacao:
          type:
          - string
          - 'null'
        localizacaoDisponivel:
          type: boolean
      additionalProperties: false
      required:
      - pedidoId
      - titularNome
      - registradoEm
      - origem
      - latitude
      - longitude
      - observacao
      - localizacaoDisponivel
    Sessao:
      type: object
      properties:
        sessaoId:
          type: string
          format: uuid
        iniciadaEm:
          type: string
          format: date-time
        expiraEm:
          type: string
          format: date-time
        encerradaEm:
          type:
          - string
          - 'null'
          format: date-time
        motivoEncerramento:
          type:
          - string
          - 'null'
          enum:
          - manual
          - tempo_maximo
          - null
      additionalProperties: false
      required:
      - sessaoId
      - iniciadaEm
      - expiraEm
      - encerradaEm
      - motivoEncerramento
    PareamentoEntrada:
      type: object
      properties:
        apelido:
          type: string
          minLength: 1
          maxLength: 80
      additionalProperties: false
      required:
      - apelido
    PareamentoCriado:
      type: object
      properties:
        codigo:
          type: string
        expiraEm:
          type: string
          format: date-time
        usoUnico:
          type: boolean
      additionalProperties: false
      required:
      - codigo
      - expiraEm
      - usoUnico
    AtivacaoDispositivo:
      type: object
      properties:
        codigo:
          type: string
        identificadorLocal:
          type: string
          maxLength: 80
      additionalProperties: false
      required:
      - codigo
      - identificadorLocal
    CredencialDispositivo:
      type: object
      properties:
        dispositivoId:
          type: string
          format: uuid
        chaveDispositivo:
          type: string
        escopo:
          type: array
          items:
            type: string
      additionalProperties: false
      required:
      - dispositivoId
      - chaveDispositivo
      - escopo
    Metricas:
      type: object
      properties:
        pedidosRegistrados:
          type: integer
          minimum: 0
        pedidosSemDestinatarios:
          type: integer
          minimum: 0
        despachosAceitosProvedor:
          type: integer
          minimum: 0
        sessoesEncerradas:
          type: integer
          minimum: 0
        periodoInicio:
          type: string
          format: date-time
        periodoFim:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - pedidosRegistrados
      - pedidosSemDestinatarios
      - despachosAceitosProvedor
      - sessoesEncerradas
      - periodoInicio
      - periodoFim
    Saude:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degradado
        versaoApi:
          type: string
      additionalProperties: false
      required:
      - status
      - versaoApi
    CadastroAceito:
      type: object
      properties:
        mensagem:
          type: string
          enum:
          - Se os dados forem elegiveis, a solicitacao de cadastro sera processada.
      additionalProperties: false
      required:
      - mensagem
      description: Resposta indistinguível para cadastro de e-mail novo e e-mail existente. Não demonstra existência
        de conta.
    RenovarTokenEntrada:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 16
      additionalProperties: false
      required:
      - refreshToken
    LimiaresNivel:
      type: object
      properties:
        nivel1Minimo:
          type: number
          minimum: 0
        nivel2Minimo:
          type: number
          minimum: 0
        nivel3Minimo:
          type: number
          minimum: 0
      additionalProperties: false
      required:
      - nivel1Minimo
      - nivel2Minimo
      - nivel3Minimo
      description: Cortes inclusivos no inicio de cada nivel. Limiares de exemplo aguardam validacao do ML.
    PushPedidoAjuda:
      type: object
      properties:
        tipo:
          type: string
          const: pedido_ajuda
        pedidoId:
          type: string
          format: uuid
      additionalProperties: false
      required:
      - tipo
      - pedidoId
      description: Somente estes dois campos no data payload de push; nunca incluir nome, posicao, observacao,
        JWT ou token de dispositivo. Notificacao visivel com texto generico.
    Coordenada:
      type: object
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      additionalProperties: false
      required:
      - latitude
      - longitude
    AvaliacaoRotasEntrada:
      type: object
      properties:
        origem:
          $ref: '#/components/schemas/Coordenada'
        destino:
          $ref: '#/components/schemas/Coordenada'
        saidaEm:
          type: string
          format: date-time
          description: ISO 8601 com timezone. Servidor valida saída >= agora - 5min, saída <= agora +48h, e
            término de cada rota <= agora +48h; 422 SAIDA_FORA_JANELA.
      additionalProperties: false
      required:
      - origem
      - destino
      - saidaEm
    RotaAvaliada:
      type: object
      properties:
        rotaId:
          type: string
        distanciaMetros:
          type: number
          minimum: 0
        duracaoSegundos:
          type: number
          minimum: 0
        exposicaoRelativa:
          type:
          - number
          - 'null'
          minimum: 0
          description: 'Unidade: metros ponderados por risco relativo, normalizados por cobertura conhecida.
            (Σ Lconhecida×risco / LconhecidaTotal)×Ltotal. Quantização contratual: arredondar para duas casas
            decimais (meio afastado de zero) antes de calcular ranking/empate; valor retornado é o usado no
            ranking.'
        percentualSemEstimativa:
          type: number
          minimum: 0
          maximum: 100
          description: 100 - 100×metrosComEstimativa/metragemTotal. Não é risco zero nem substitui medição.
        geometriaCodificada:
          type: string
          minLength: 1
          description: Polyline codificada Google Polyline5, retornada inclusive quando comparação inconclusiva;
            não persistir nem registrar em logs.
        posicao:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 3
          description: Posição densa 1,1,2 para empates (grupos ancorados no menor valor ainda não classificado).
            Inconclusiva sempre null. Posição calculada a partir de exposicaoRelativa de duas casas exibida
            ao cliente.
      additionalProperties: false
      required:
      - rotaId
      - distanciaMetros
      - duracaoSegundos
      - exposicaoRelativa
      - percentualSemEstimativa
      - geometriaCodificada
      - posicao
    AvaliacaoRotasResultado:
      type: object
      properties:
        situacao:
          type: string
          enum:
          - concluida
          - inconclusiva
          - indisponivel
          description: 'concluida: todas rotas classificadas; inconclusiva: sem posições; indisponivel: rotas
            vazias.'
        motivo:
          type:
          - string
          - 'null'
          enum:
          - null
          - cobertura_insuficiente
          - apenas_uma_rota
          - provedor_rotas_indisponivel
          - sem_alternativas
          - grade_indisponivel
          - fora_territorio
          description: 'Precedência: indisponível > cobertura insuficiente > rota única >=70% > comparação
            concluída. Fora território é indisponivel.'
        versaoGrade:
          type:
          - string
          - 'null'
        coberturaMinimaPercentual:
          type: number
          const: 70
          description: Valor normativo fixado na v0.5. Alteração requer versionamento de contrato.
        rotas:
          type: array
          items:
            $ref: '#/components/schemas/RotaAvaliada'
          maxItems: 3
        unidadeExposicao:
          type: string
          const: metro_risco_relativo
        metodoTrechoDesconhecido:
          type: string
          const: extrapolacao_media_trechos_conhecidos
        empateTecnicoPercentual:
          type: number
          const: 5
          description: Diferença estritamente inferior a 5% da menor exposição do grupo; grupos sucessivos,
            posições densas.
      additionalProperties: false
      required:
      - situacao
      - motivo
      - versaoGrade
      - coberturaMinimaPercentual
      - rotas
      - unidadeExposicao
      - metodoTrechoDesconhecido
      - empateTecnicoPercentual
      description: 'Comparação com limite de 70%. Se qualquer rota estiver abaixo: inconclusiva, todas sem
        posição; notas preservadas só para rotas com >=70%. O schema valida notas individuais; ordem e empate
        são testados no validador de domínio.'
      allOf:
      - if:
          properties:
            situacao:
              const: concluida
          required:
          - situacao
        then:
          properties:
            motivo:
              type: 'null'
            versaoGrade:
              type: string
              minLength: 1
            rotas:
              minItems: 2
              maxItems: 3
              items:
                allOf:
                - $ref: '#/components/schemas/RotaAvaliada'
                - properties:
                    posicao:
                      type: integer
                      minimum: 1
                      maximum: 3
                    exposicaoRelativa:
                      type: number
                      minimum: 0
                    percentualSemEstimativa:
                      maximum: 30
                    geometriaCodificada:
                      type: string
                      minLength: 1
      - if:
          properties:
            situacao:
              const: inconclusiva
          required:
          - situacao
        then:
          properties:
            motivo:
              enum:
              - cobertura_insuficiente
              - apenas_uma_rota
      - if:
          properties:
            situacao:
              const: inconclusiva
            motivo:
              const: apenas_uma_rota
          required:
          - situacao
          - motivo
        then:
          properties:
            versaoGrade:
              type: string
              minLength: 1
            rotas:
              minItems: 1
              maxItems: 1
              items:
                allOf:
                - $ref: '#/components/schemas/RotaAvaliada'
                - properties:
                    posicao:
                      type: 'null'
                    exposicaoRelativa:
                      type: number
                      minimum: 0
                    percentualSemEstimativa:
                      maximum: 30
      - if:
          properties:
            situacao:
              const: inconclusiva
            motivo:
              const: cobertura_insuficiente
          required:
          - situacao
          - motivo
        then:
          properties:
            versaoGrade:
              type: string
              minLength: 1
            rotas:
              minItems: 1
              maxItems: 3
              contains:
                properties:
                  percentualSemEstimativa:
                    exclusiveMinimum: 30
                required:
                - percentualSemEstimativa
              items:
                allOf:
                - $ref: '#/components/schemas/RotaAvaliada'
                - if:
                    properties:
                      percentualSemEstimativa:
                        maximum: 30
                    required:
                    - percentualSemEstimativa
                  then:
                    properties:
                      exposicaoRelativa:
                        type: number
                        minimum: 0
                      posicao:
                        type: 'null'
                  else:
                    properties:
                      exposicaoRelativa:
                        type: 'null'
                      posicao:
                        type: 'null'
      - if:
          properties:
            situacao:
              const: indisponivel
          required:
          - situacao
        then:
          properties:
            motivo:
              enum:
              - provedor_rotas_indisponivel
              - sem_alternativas
              - grade_indisponivel
              - fora_territorio
            rotas:
              maxItems: 0
    ConfirmarEmailEntrada:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 512
        nome:
          type: string
          minLength: 2
          maxLength: 100
        senha:
          type: string
