      required:
      - mensagem
      additionalProperties: false
    ErroLimiteDispositivos:
      type: object
      additionalProperties: false
      description: Limite de dispositivos ativos excedido. Histórico revogado não consome vagas.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          const: 409
        detail:
          type: string
        code:
          type: string
          const: LIMITE_DISPOSITIVOS_ATIVOS
        traceId:
          type: string
      required:
      - title
      - status
      - code
      - traceId
    DispositivoResumo:
      type: object
      additionalProperties: false
      description: Dispositivo vinculado ao titular, sem credencial secreta. Revogados continuam visíveis no
        histórico administrativo pessoal.
      properties:
        dispositivoId:
          type: string
          format: uuid
        tipo:
          type: string
          enum:
          - esp32
          - wokwi
        apelido:
          type: string
          minLength: 1
          maxLength: 80
        estado:
          type: string
          enum:
          - ativo
          - revogado
        vinculadoEm:
          type: string
          format: date-time
        ultimoUsoEm:
          type:
          - string
          - 'null'
          format: date-time
        revogadoEm:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - dispositivoId
      - tipo
      - apelido
      - estado
      - vinculadoEm
      - ultimoUsoEm
      - revogadoEm
      allOf:
      - if:
          properties:
            estado:
              const: ativo
        then:
          properties:
            revogadoEm:
              type: 'null'
      - if:
          properties:
            estado:
              const: revogado
        then:
          properties:
            revogadoEm:
              type: string
              format: date-time
    DispositivosLista:
      type: array
      items:
        $ref: '#/components/schemas/DispositivoResumo'
      maxItems: 100
x-decisoes-pendentes:
- Método estatístico e limiares risco (Nando)
- Confirmar rota intermediada pela API ou pelo app (Mari/Abner)
- Validade da confirmação e-mail 30 min, refresh 7d/30d e tolerância 45s
- Parâmetros 70% cobertura / 5% empate / 0.02° bbox
- Período de retenção de localização, coordenação com LGPD
- Provedor externo de rotas e horários de atuação do iOS
