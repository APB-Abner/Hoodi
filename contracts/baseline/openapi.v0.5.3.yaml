      operationId: post_v1_auth_renovar
      summary: Renovar JWT usando refresh token rotativo
      description: 'Access JWT: 60 min; refresh: expiração deslizante após 7 dias de inatividade, limitada
        por prazo absoluto de 30 dias desde login. Rotação atômica. Durante 45 s após rotação, replay do token
        anterior DEVE retornar o MESMO par access+refresh do primeiro sucesso, sem nova rotação. Guardar resposta
        de replay cifrada (AEAD) por 45 s e o hash dos tokens; nunca guardar refresh em claro permanente. Fora
        da tolerância, reutilização é suspeita e revoga família. Exigir single-flight de renovação no app,
        com retry de rede do MESMO token durante janela. Não é promessa de funcionamento offline nem no background
        iOS. Família revogada ou prazo absoluto concluído exige autenticação; app deve informar falha sem declarar
        pedido registrado.'
