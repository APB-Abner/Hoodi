openapi: 3.1.0
info:
  title: RotaAlerta — Contratos de Integração
  version: 0.5.3
  description: RotaAlerta GS2026 — baseline v0.5.1 + patches v0.5.2/v0.5.3 de convites e validacao; Etapa 2 v1.5 e Especificação v1.3. Contratos e
    exemplos sintéticos, sem garantia de execução real.
servers:
- url: http://localhost:5000
  description: Desenvolvimento local (não transmitir dados reais)
- url: https://api.exemplo.invalid
  description: Placeholder; substituir por HTTPS real na VM
tags:
- name: Autenticacao
- name: Contatos
- name: Push
- name: Risco
- name: Panico
- name: Trajetos
- name: Dispositivos
- name: Administracao
- name: Saude
- name: Rotas
security:
- bearerAuth: []
paths:
  /v1/auth/registrar:
    post:
      tags:
      - Autenticacao
      summary: Solicitar cadastro com confirmação da posse do e-mail
      operationId: post_v1_auth_registrar
      responses:
        '202':
          description: Solicitação aceita genericamente; acesso só após confirmar e-mail, sem informar existência.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroAceito'
              example:
                mensagem: Se os dados forem elegiveis, a solicitacao de cadastro sera processada.
        '400':
          description: Dados invalidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
        '429':
          description: Excesso de tentativas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroEntrada'
            example:
              email: titular.exemplo@example.invalid
      security: []
      description: Solicitar token de cadastro só com e-mail, sem senha/nome. 202 genérico para e-mail novo/existente;
        não cria conta autenticável nem altera senha já cadastrada. Pedido novo fica pendente até confirmação
        fora de banda. Token é enviado ao e-mail apenas se elegível; não expor em resposta ou logs. Em dev
        Mailpit com acesso restrito. Limitar tentativas e atrasos observáveis; casos repetidos pendentes não
        geram contas duplicadas. Se houver cadastro pendente e um pedido novo elegível chegar depois do cooldown,
        reemitir token de cadastro de 30 min, invalidando atomicamente o token anterior. Requisição para conta
        confirmada NÃO emite token de cadastro e nunca altera senha. A resposta pública segue 202 indistinguível
        para ambos os casos; rate limit restringe abuso de e-mail.
  /v1/auth/login:
    post:
      tags:
      - Autenticacao
      summary: Autenticar
      operationId: post_v1_auth_login
      responses:
        '400':
          description: Corpo ausente, malformado ou com campos invalidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
        '200':
          description: JWT emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensAuth'
              example: &id001
                accessToken: JWT_SINTETICO_NAO_VALIDO
                tokenType: Bearer
                expiraEm: '2026-11-08T15:00:00-03:00'
                usuario:
                  id: e508490e-c7fb-4cb3-8142-248860a88711
                  nome: Pessoa Exemplo
                  email: titular.exemplo@example.invalid
                refreshToken: REFRESH_FICTICIO_NAO_VALIDO_E_USO_UNICO
                expiraRefreshEm: '2026-11-15T14:00:00-03:00'
        '401':
          description: Credenciais inválidas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
        '429':
          description: Muitas tentativas de login
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginEntrada'
            example:
              email: titular.exemplo@example.invalid
              senha: EXEMPLO_NAO_USAR_123!
      security: []
      description: 'Somente contas verificadas podem entrar. Conta pendente, inexistente ou senha inválida:
        401 genérico sem diferenciar causa.'
  /v1/contatos/convites:
    post:
      tags:
      - Contatos
      summary: Emitir convite unidirecional A→B
      operationId: post_v1_contatos_convites
      responses:
        '201':
          description: Código de uso único
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NovoConvite'
              example:
                codigo: 0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF
                expiraEm: '2026-11-08T15:00:00-03:00'
                direcao: titular_para_contato
                conviteId: 112f8c2c-e4df-4bb4-bd77-38cf7041f60c
        '429':
          description: Limite de convites
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
      description: Código é criado sem identificar B; duplicidade por par ordenado é checada no resgate.
    get:
      tags:
      - Contatos
      operationId: get_v1_contatos_convites
      summary: Listar convites pendentes emitidos pelo usuário
      description: O emissor pode recuperar conviteId após reinstalação para cancelá-lo. Código secreto não
        é retornado novamente.
      responses:
        '200':
          description: Convites pendentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConvitePendenteResumo'
              example:
              - conviteId: 112f8c2c-e4df-4bb4-bd77-38cf7041f60c
                expiraEm: '2026-11-08T22:00:00-03:00'
                estado: pendente
                direcao: titular_para_contato
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
  /v1/contatos/convites/resgatar:
    post:
      tags:
      - Contatos
      summary: Aceitar ou rejeitar convite
      description: >-
        Validar nesta ordem: (1) codigo existente, pendente e nao expirado; caso contrario 409,
        para ambas as decisoes; (2) emissor tentando resgatar o proprio convite recebe
        422 VINCULO_PROPRIO em ambas as decisoes; para desistir, deve usar DELETE;
        (3) rejeitar encerra o convite como rejeitado e retorna 204 sem verificar duplicidade
        nem criar vinculo; (4) aceitar verifica duplicidade do par, retorna 409 se ja houver
        vinculo ativo ou 200 com Vinculo apos criar o relacionamento. Convite rejeitado
        desaparece do GET de convites pendentes do emissor; nao ha garantia de ocultar
        que o convite foi encerrado.
      operationId: post_v1_contatos_convites_resgatar
      responses:
        '400':
          description: Corpo ausente, malformado ou com campos invalidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
        '200':
          description: Convite aceito; vínculo criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vinculo'
              example:
                id: aa0c6cb6-05e5-4cf2-9211-cb53cb03b87c
                titularId: e508490e-c7fb-4cb3-8142-248860a88711
                contatoId: 5277d7b7-cef5-4fdd-a06b-20c7e63b4a7f
                estado: aceito
                direcao: titular_para_contato
                nomeExibicao: Pessoa Exemplo
                papelDoSolicitante: contato
        '204':
          description: Convite rejeitado; nenhum vínculo criado
        '422':
          description: Emissor não pode aceitar nem rejeitar o próprio convite
          content:
            application/problem+json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Erro'
                - type: object
                  properties:
                    status:
                      const: 422
                    code:
                      const: VINCULO_PROPRIO
                  required:
                  - status
                  - code
        '409':
          description: Código inexistente, expirado ou encerrado; ou vínculo ativo duplicado apenas no aceite
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
        '429':
          description: Excesso de tentativas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResgateConviteEntrada'
  /v1/contatos:
    get:
      tags:
      - Contatos
      summary: Listar vínculos dos quais sou titular ou contato
      operationId: get_v1_contatos
      responses:
        '200':
          description: Vínculos visíveis ao usuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vinculo'
      description: Lista apenas vinculos visiveis ao usuario autenticado, com nomeExibicao do outro participante.
        Convites pendentes nao sao vinculos aceitos.
  /v1/contatos/{vinculoId}:
    delete:
      tags:
      - Contatos
      summary: Revogar vínculo aceito de qualquer um dos lados
      operationId: delete_v1_contatos_vinculoId
      responses:
        '204':
          description: Vínculo revogado
        '404':
          description: Não encontrado ou sem autorização
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
      parameters:
      - name: vinculoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/push/tokens:
    put:
      tags:
      - Push
      summary: Registrar/renovar token Expo da instalação
      operationId: put_v1_push_tokens
      responses:
        '200':
          description: Token registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPushResumo'
              example:
                id: 79292377-053c-40e7-a48b-7e6d3e29a2f6
                ativo: true
        '422':
          description: Token inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenPushEntrada'
  /v1/push/tokens/{tokenId}:
    delete:
      tags:
      - Push
      summary: Desativar token
      operationId: delete_v1_push_tokens_tokenId
      responses:
        '204':
          description: Desativado
        '404':
          description: Não encontrado ou sem autorização
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
      parameters:
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /v1/risco/versao-atual:
    get:
      tags:
      - Risco
      summary: Identificar versão vigente
      operationId: get_v1_risco_versao_atual
      responses:
        '200':
          description: Versão publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersaoGrade'
        '404':
          description: Nenhuma grade publicada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
      security: []
      description: Endpoint público apenas com metadados; nenhuma localização do usuário é recebida.
  /v1/risco/grade:
    get:
      tags:
      - Risco
      summary: Baixar grade de 1 ou 2 dias no fuso São Paulo
      operationId: get_v1_risco_grade
      responses:
        '200':
          description: Pacote coerente da grade Consulta paginada com no máximo 1000 células; proximoCursor
            = null na última página. Todas páginas são da MESMA versão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
              example:
                versao: mock-2026-11-08-v1
                fuso: America/Sao_Paulo
                dataInicio: '2026-11-08'
                dataFim: '2026-11-09'
                geradaEm: '2026-11-08T12:00:00-03:00'
                periodoDados: 2026-01-01/2026-10-31
                referencia:
                  area: regiao_sintetica_de_teste
                  tipo: frequencia_relativa_ocorrencias
                  denominador: media_sintetica_de_ocorrencias_por_celula_na_mesma_faixa_e_tipo_dia
                  metodo: contagens_sinteticas_divididas_por_media_sintetica_do_grupo
                  naoEhProbabilidadeIndividual: true
                  limiaresNivel:
                    nivel1Minimo: 0.8
                    nivel2Minimo: 1.25
                    nivel3Minimo: 1.55
                celulas:
                - geohash: 6gyf4bf
                  faixaHoraria: 21
                  tipoDia: util
                  nivel: 0
                  riscoRelativo: 0.65
                  nOcorrencias: 7
                  suficiente: true
                  motivoDesconhecido: null
                - geohash: 6gyf4bg
                  faixaHoraria: 21
                  tipoDia: fim_semana
                  nivel: 1
                  riscoRelativo: 0.8
                  nOcorrencias: 8
                  suficiente: true
                  motivoDesconhecido: null
                - geohash: 6gyf4bh
                  faixaHoraria: 21
                  tipoDia: util
                  nivel: 1
                  riscoRelativo: 0.95
                  nOcorrencias: 9
                  suficiente: true
                  motivoDesconhecido: null
                - geohash: 6gyf4bj
                  faixaHoraria: 21
                  tipoDia: util
                  nivel: null
                  riscoRelativo: null
                  nOcorrencias: 1
                  suficiente: false
                  motivoDesconhecido: amostra_insuficiente
                - geohash: 6gyf4bk
                  faixaHoraria: 21
                  tipoDia: fim_semana
                  nivel: 2
                  riscoRelativo: 1.25
                  nOcorrencias: 11
                  suficiente: true
                  motivoDesconhecido: null
                - geohash: 6gyf4bm
                  faixaHoraria: 22
                  tipoDia: util
                  nivel: 2
                  riscoRelativo: 1.4
                  nOcorrencias: 12
                  suficiente: true
                  motivoDesconhecido: null
                - geohash: 6gyf4bn
                  faixaHoraria: 22
                  tipoDia: util
                  nivel: 3
                  riscoRelativo: 1.55
                  nOcorrencias: 13
                  suficiente: true
                  motivoDesconhecido: null
                - geohash: 6gyf4bp
                  faixaHoraria: 22
                  tipoDia: fim_semana
                  nivel: 3
                  riscoRelativo: 1.7
                  nOcorrencias: 14
                  suficiente: true
                  motivoDesconhecido: null
                - geohash: 6gyf4bq
                  faixaHoraria: 22
                  tipoDia: fim_semana
                  nivel: null
                  riscoRelativo: null
                  nOcorrencias: 1
                  suficiente: false
                  motivoDesconhecido: amostra_insuficiente
                - geohash: 6gyf4br
                  faixaHoraria: 22
                  tipoDia: util
                  nivel: 3
                  riscoRelativo: 2.0
                  nOcorrencias: 16
                  suficiente: true
                  motivoDesconhecido: null
                precisaoGeohash: 7
                limitePagina: 500
                proximoCursor: null
          headers:
            Cache-Control:
              description: Até data planejada da próxima atualização da grade (nunca assume cache eterno)
              schema:
                type: string
        '400':
          description: Parâmetro inválido de região, formato, limite ou filtros conflitantes; CURSOR_INVALIDO
            se cursor expirou/foi usado com filtros divergentes; LIMITE_INVALIDO fora de 1..1000. Expiração
            / assinatura inválida do cursor não provoca troca de versão; cliente reinicia paginação.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErroBbox'
              example:
                title: Região inválida
                status: 400
                code: BBOX_INVALIDA
                traceId: trace-sintetico-400
                detail: Lados da bbox não podem ultrapassar 0.02 grau.
        '404':
          description: Grade indisponível
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
      parameters:
      - name: prefixo
        in: query
        required: false
        schema:
          type: string
          minLength: 5
          maxLength: 6
          pattern: ^[0123456789bcdefghjkmnpqrstuvwxyz]{5,6}$
        description: Prefixo geohash da região
      - name: bbox
        in: query
        required: false
        description: 'latMin,lonMin,latMax,lonMax; latMin<latMax, lonMin<lonMax e cada lado <= 0.02 grau, valores
          nas faixas geográficas válidas. Fora disso: 400 BBOX_INVALIDA.'
        schema:
          type: string
          pattern: ^-?\d+(?:\.\d+)?,-?\d+(?:\.\d+)?,-?\d+(?:\.\d+)?,-?\d+(?:\.\d+)?$
        example: -23.565,-46.655,-23.545,-46.630
      - name: dataInicio
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: dias
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 2
        description: 1 a 2 dias civis, incluindo virada
      - name: versao
        in: query
        required: false
        schema:
          type: string
          minLength: 1
        description: Versão imutável desejada, para alinhar mapa com ranking. Se indisponível, retorna 404
          sem trocar silenciosamente a versão. Versões usadas por cursores são retidas >=60 min desde a última
          emissão.
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
        description: Quantidade máxima de células retornadas (default 500, máximo 1000).
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 8
          maxLength: 1024
        description: Cursor opaco, assinado, com validade de 30 min, preso à versão/filtro/datas/limite. Não
          alterar filtros ao paginar. Preserva versão antiga por no mínimo 60 min após última emissão; novas
          publicações não mudam o snapshot.
      security: []
      description: 'Exatamente um de prefixo ou bbox; prefixo de 5 a 6 caracteres geohash. Bbox latMin,lonMin,latMax,lonMax
        exige -90<=latitude<=90, -180<=longitude<=180, min<max e diferença <=0.02 grau em CADA eixo. Falhas
        retornam 400 com code BBOX_INVALIDA ou FILTRO_REGIAO_INVALIDO. Paginação SEMPRE disponível, limite
        padrão 500 e máximo 1000 células por página; cursor opaco com TTL 30 min e parâmetros imutáveis, ordenação
        estável geohash/faixa/tipoDia. 400 CURSOR_INVALIDO para cursor expirado ou parâmetros divergentes.
        Sem paginação completa, app não pode marcar região como coberta. App deve solicitar bbox com buffer
        para as bordas e manter pacote de uma única versão. Opcional versao consulta snapshot imutável. Usar
        período dataInicio e dias (1-2), mantendo hora/dia corretos inclusive offline; posição não vai para
        logs. Versão publicada não é apagada enquanto houver cursor válido: o servidor retém toda versão usada
        por cursor por pelo menos 60 min após a ÚLTIMA emissão de cursor dessa versão; o cursor expira em 30
        min. Se uma nova versão for publicada durante paginação, as próximas páginas seguem a versão PINADA
        no cursor original até expirar; NUNCA troca silenciosamente de snapshot. Cursor inválido/expirado retorna
        400 CURSOR_INVALIDO, exigindo reinício com versão vigente. Versão explicitamente solicitada fora da
        retenção retorna 404 VERSAO_INDISPONIVEL. Reinicialização não pode invalidar todos os cursores ainda
        válidos: cursor deve ser assinado com chave persistida na VM.'
  /v1/admin/risco/importar:
    post:
      tags:
      - Administracao
      summary: Validar CSV e publicar grade atomicamente
      operationId: post_v1_admin_risco_importar
      responses:
        '201':
          description: Versão publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoImportacao'
        '400':
          description: CSV ou manifesto inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
        '403':
          description: Somente administrador
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: Versão já publicada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                arquivoCsv:
                  type: string
                  format: binary
                manifesto:
                  type: string
                  description: Manifesto JSON serializado em texto
              additionalProperties: false
              required:
              - arquivoCsv
              - manifesto
      description: Metadados do manifesto validam a semântica. Publicação é um commit atômico; lote inválido
        não substitui o vigente. O periodo_dados de CADA linha precisa igualar manifesto.periodo_dados; precisao_geohash
        da linha precisa igualar manifesto.precisao_geohash; limiares aplicados a nivel e risco relativo devem
        ser coerentes; rejeitar o lote inteiro ao detectar discrepancia.
  /v1/panico:
    post:
      tags:
      - Panico
      summary: Registrar intenção de ajuda idempotente
      operationId: post_v1_panico
      responses:
        '202':
          description: Pedido persistido para processamento assíncrono
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanicoRegistrado'
              example:
                pedidoId: 96a38750-55dd-4259-8e5c-055504890c00
                registradoEm: '2026-11-08T14:00:00-03:00'
                origem: app
                resumo:
                  estado: em_processamento
                  total: 1
                  pendentes: 1
                  aceitosExpo: 0
                  aceitosProvedor: 0
                  abertosNoApp: 0
                  falhosOuCancelados: 0
                reutilizado: false
        '200':
          description: Replay idempotente (mesmo pedido original)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanicoRegistrado'
        '401':
          description: Autenticação inválida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: Chave reapresentada por classe de credencial diferente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErroConflitoIdempotencia'
              example:
                type: about:blank
                title: Conflito de idempotência
                status: 409
                detail: A chave já foi usada por esta conta com outra classe de credencial.
                code: IDEMPOTENCIA_CREDENCIAL_DIVERGENTE
                traceId: trace-sintetico-001
        '422':
          description: Origem incompatível com credencial ou par de coordenadas inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErroPanicoValidacao'
              example:
                title: Origem incompatível
                status: 422
                code: ORIGEM_CREDENCIAL_INCOMPATIVEL
                traceId: trace-sintetico-422
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PanicoEntrada'
            example:
              idempotencyKey: 3155ad90-86bb-41bc-b634-148091551a4a
              origem: app
              latitude: null
              longitude: null
              observacao: Pedido de teste, sem emergência real.
      security:
      - bearerAuth: []
      - deviceKey: []
      description: A chave identifica um pedido por titular. Reenvio da mesma chave com a MESMA CLASSE de credencial
        autenticada (JWT_usuario ou X-Device-Key_dispositivo) retorna o pedido original independentemente de
        origem app/watch (ambos usam JWT). Classe de credencial diferente com mesma chave retorna 409, sem
        duplicar. Latitude, longitude, observacao, horario e origem ficam congelados no primeiro registro.
        JWT expirado exige renovar pelo refresh token; dispositivo nao usa JWT. Push nao significa recebimento.
        JWT usuário admite origem app ou watch; X-Device-Key admite somente esp32. Classe/origem incompatível
        → 422 ORIGEM_CREDENCIAL_INCOMPATIVEL. O cliente gera UUID de idempotência no PRIMEIRO acionamento (incluindo
        handler da notificação no Watch encaminhada ao iPhone), persiste atomicamente e reutiliza por 120 s
        para a mesma intenção entre Watch/app; depois gera nova chave. Servidor retém vínculo (titular,chave,classe,identificador
        do pedido) por pelo menos 30 dias; coordenadas/observações seguem políticas de retenção separadas.
        A API deduplica pela chave, independentemente da hora do replay enquanto a associação existir. Nunca
        reutilizar chave no cliente após janela.  Replay em 200 inclui reutilizado=true, mesmo pedidoId e registradoEm
        originais, sem atualizar posição, mas resumo derivado pode refletir somente evolução dos despachos
        já persistidos. A interface diz "Pedido já registrado às HH:MM; localização original mantida", não
        afirma que novo toque atualizou GPS. Primeiro 202 inclui reutilizado=false. Replay com chave já existente
        nunca adiciona destinatários/trabalhos novos, nem muda coordenadas, origem ou instante. Somente fases
        dos despachos PREEXISTENTES podem evoluir no resumo. Interface mostra “Pedido já registrado às HH:MM”,
        sem dizer “localização atualizada”.
      x-contratoPush:
        $ref: '#/components/schemas/PushPedidoAjuda'
